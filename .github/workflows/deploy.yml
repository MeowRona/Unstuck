name: Test and deploy Unstuck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unstuck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q .
      - name: Check browser JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/planner.js
      - name: Test
        run: python -m unittest discover -s tests -q

      - name: Install browser-smoke dependency
        if: github.event_name == 'pull_request'
        run: python -m pip install --disable-pip-version-check -q selenium==4.36.0

      - name: Desktop and narrow-mobile browser smoke
        if: github.event_name == 'pull_request'
        run: |
          python app.py --host 127.0.0.1 --port 8817 --mode fixture --catalog real > /tmp/unstuck-browser-smoke.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8817/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          python tools/browser_smoke.py

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://unstuck-city-compass.onrender.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger exact commit on Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOOK"
          case "$DEPLOY_HOOK" in
            *\?*) url="${DEPLOY_HOOK}&ref=${COMMIT_SHA}" ;;
            *)   url="${DEPLOY_HOOK}?ref=${COMMIT_SHA}" ;;
          esac
          curl --fail --silent --show-error --max-time 30 -X POST "$url" >/dev/null

      - name: Wait for the exact commit to become live
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          expected = os.environ['COMMIT_SHA']
          url = 'https://unstuck-city-compass.onrender.com/api/version'
          deadline = time.time() + 600
          last = None
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      payload = json.load(response)
                  last = payload.get('git_commit')
                  if last == expected:
                      print(f'Live commit verified: {last}')
                      break
              except Exception as exc:
                  print(f'Waiting for Render: {exc}')
              time.sleep(10)
          else:
              raise SystemExit(f'Timed out waiting for {expected}; last live commit was {last}')
          PY

      - name: Production smoke test
        env:
          UNSTUCK_PUBLIC_URL: https://unstuck-city-compass.onrender.com
        run: |
          curl --fail --silent --show-error --max-time 30 https://unstuck-city-compass.onrender.com/ >/dev/null
          python tools/production_smoke.py
